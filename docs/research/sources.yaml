  - id: opengroup-archimate-meff
    title: ArchiMate Model Exchange File Format
    publisher: The Open Group
    url: https://www.opengroup.org/open-group-archimate-model-exchange-file-format
    version: public web page
    retrieved_at: 2026-09-23
    license_or_terms: public web page; schemas/artifacts require separate verification
    redistribution: Link and summarize; verify artifact redistribution before bundling.
    source_revision: unknown
    confidence: high
    claims:
      - The Open Group describes MEFF as a standard file format for exchanging ArchiMate models between tools.
      - The official FAQ distinguishes model exchange, view exchange, and diagram exchange schemas.
      - The FAQ says the format conveys model data between tools and is not intended as persistent model storage.
      - The FAQ applies the exchange format to ArchiMate 3.1 and 3.2 and points to schema/example resources.
    constraints:
      - Exchange format should not be treated as native persistence without analysis.
      - Public overview/FAQ statements do not prove any repository fixture conforms to the licensed standard.
      - Do not copy or bundle official XSDs or examples without verifying their redistribution terms.
      - Keep public example resources distinct from permission to redistribute them.
    review_after: 2026-12-23

  - id: opengroup-archimate-meff-xsd
    title: ArchiMate Model Exchange File Format schema resources
    publisher: The Open Group
    url: https://www.opengroup.org/xsd/archimate/
    version: Public page describing the ArchiMate 3.1 Model, View, and Diagram schema set
    retrieved_at: 2026-09-23
    license_or_terms: Schema files and examples linked from the Open Group resource page; redistribution terms not verified
    redistribution: Link only; do not bundle schemas or examples until terms are reviewed.
    source_revision: public web resource page observed 2026-09-23
    confidence: high
    claims:
      - Public MEFF resources expose the 3.1 schema set and divide it into model, view, and diagram exchange schemas.
      - The model schema URL uses the archimate/3.0 namespace.
      - Generated Model schema documentation requires model identity and name fields and uses XML ID/IDREF types for identifiers and relationship endpoints.
    constraints:
      - These public schema artifacts are not bundled or treated as permission for redistribution.
      - The existence of a schema resource does not validate repository fixtures or demonstrate interoperability.
      - The public 3.1 XSD set does not establish a separate 3.2 XSD artifact.
    review_after: 2026-12-23

  - id: opengroup-archimate-tool-certification
