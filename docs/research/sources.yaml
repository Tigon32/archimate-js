    redistribution: Link and summarize only; do not claim certification without completing the program.
    source_revision: Public indexed page observed 2026-09-23
    confidence: high
    claims:
      - The Open Group says ArchiMate 3 certified tools have been required to support MEFF since June 2018.
      - The certification page describes a formal supporting-documentation and audit process.
      - The linked Test Model directory requires member login.
    constraints:
