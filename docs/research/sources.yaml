  - id: archimate-renderer-reference
    title: ThomasRohde/archimate-renderer
    publisher: Thomas Rohde
    url: https://github.com/ThomasRohde/archimate-renderer
    version: public repository observed at 1.5.1
    retrieved_at: 2026-09-23
    license_or_terms: MIT
    redistribution: May inform rendering design; direct reuse requires provenance and notices.
    source_revision: not pinned
    confidence: medium
    claims:
      - TypeScript library for rendering ArchiMate model XML as SVG in Node.js and browsers.
      - Useful reference for deterministic report rendering but not a full live modeler replacement.
    constraints:
      - Must verify semantic fidelity and exchange-format support before relying on behavior.
    review_after: 2026-12-23
