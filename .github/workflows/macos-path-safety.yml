name: macOS path safety

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/cli/io.mts"
      - "test/unit/cli-export.test.mts"
      - ".github/workflows/macos-path-safety.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  path-safety:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Verify canonical macOS temp-path safety
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run path alias, rollback, and symlink regression checks
        run: npx vitest run test/unit/cli-export.test.mts
