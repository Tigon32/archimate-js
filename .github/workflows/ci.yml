name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-primary:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Primary qualification on Node.js 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run canonical deterministic qualification
        run: npm run verify:local
        env:
          SOURCE_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run browser CLI coverage not included in verify:local
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm run test:cli:browser

      - name: Assert synthetic Node performance smoke baseline
        run: node test/performance/benchmark.mts --smoke --assert --output=performance-baseline-node-24.json

      - name: Capture synthetic browser render timing
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm run compile:model-dto:browser
          node test/performance/browser-benchmark.mts --output=test-results/performance-baseline-browser.json

      - name: Retain primary qualification evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: primary-qualification-evidence
          path: |
            performance-baseline-node-24.json
            test-results/performance-baseline-browser.json
            test-results/read-only-showcase.png
          if-no-files-found: error
          retention-days: 30

      - name: Retain synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-synthetic-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  node22-compatibility:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: verify-primary
    name: Targeted Node.js 22 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run compatibility-sensitive package and CLI checks
        run: npm run verify:compat-node22
