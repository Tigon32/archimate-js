name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-path-safety:
    name: Verify macOS batch path safety
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run batch rollback and symlink checks
        run: npx vitest run test/unit/cli-export.test.mts

  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Enforce TypeScript migration and source-size policy
        run: npm run check:source-policy
        env:
          SOURCE_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run smoke tests
        run: npm test

      - name: Compile public entry point
        run: npm run compile

      - name: Assert synthetic Node performance smoke baseline
        run: node test/performance/benchmark.mts --smoke --assert --output=performance-baseline-node-${{ matrix.node-version }}.json

      - name: Retain synthetic Node performance baseline
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-baseline-node-${{ matrix.node-version }}
          path: performance-baseline-node-${{ matrix.node-version }}.json
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    name: Playwright report browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile public entry point
        run: npm run compile

      - name: Run synthetic report journeys with Playwright
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm run test:browser
          npm run test:cli:browser

      - name: Retain verified synthetic rendering screenshot
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-only-showcase-screenshot
          path: test-results/read-only-showcase.png
          if-no-files-found: error
          retention-days: 30

      - name: Retain synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-synthetic-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
