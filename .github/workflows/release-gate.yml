name: Release gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-readiness:
    name: Read-only release readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify version, changelog, API boundary, and release checks
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm run release:check

      - name: Generate packaged release evidence
        run: node scripts/create-release-evidence.mjs
        env:
          RELEASE_CHECK_PASSED: '1'
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archimate-release-evidence

      - name: Retain packaged release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/archimate-release-evidence/
          if-no-files-found: error
          retention-days: 30
