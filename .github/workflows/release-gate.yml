name: Release gate

on:
  pull_request:
    paths:
      - '.github/workflows/release-gate.yml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-readiness:
    name: Read-only release readiness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify version, changelog, API boundary, and release checks
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm run release:check

      - name: Generate packaged release evidence
        run: node scripts/create-release-evidence.mjs
        env:
          RELEASE_CHECK_PASSED: '1'
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archimate-release-evidence

      - name: Verify packed non-code asset provenance
        shell: bash
        run: |
          set -euo pipefail
          node test/release/packed-assets.test.mts
          tarballs=( "$RUNNER_TEMP"/archimate-release-evidence/*.tgz )
          test "${#tarballs[@]}" -eq 1
          node scripts/check-packed-assets.mts "${tarballs[0]}"

      - name: Retain packaged release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/archimate-release-evidence/
          if-no-files-found: error
          retention-days: 30

  download-artifact-smoke:
    name: Synthetic download-artifact v8 round-trip
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Create synthetic release evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/archimate-synthetic-evidence"
          mkdir -p "$evidence/payload"
          printf '%s\n' 'SYNTHETIC fixture for actions/download-artifact v8 integration test' > "$evidence/payload/fixture.txt"
          tar -czf "$evidence/synthetic-release-evidence.tgz" -C "$evidence/payload" fixture.txt
          (cd "$evidence" && sha256sum ./*.tgz > SHA256SUMS)

      - name: Upload synthetic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-release-evidence
          path: ${{ runner.temp }}/archimate-synthetic-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Download synthetic evidence with v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthetic-release-evidence
          path: ${{ runner.temp }}/archimate-synthetic-evidence-download

      - name: Verify downloaded synthetic evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/archimate-synthetic-evidence-download"
          cd "$evidence"
          sha256sum --status --check SHA256SUMS
          tarballs=( ./*.tgz )
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"
          mkdir extracted
          tar -xzf "${tarballs[0]}" -C extracted
          test "$(cat extracted/fixture.txt)" = 'SYNTHETIC fixture for actions/download-artifact v8 integration test'

  attest-release:
    name: Attest verified release tarball
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release evidence from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/archimate-release-evidence

      - name: Verify checksums and select the single tarball
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archimate-release-evidence"
          sha256sum --status --check SHA256SUMS
          tarballs=( ./*.tgz )
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"
          printf 'path=%s\n' "$PWD/${tarballs[0]#./}" >> "$GITHUB_OUTPUT"

      - name: Attest packed tarball provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.path }}
