name: MEFF XSD validation

on:
  pull_request:
    paths:
      - ".github/workflows/meff-xsd-validation.yml"
      - "test/fixtures/meff-schema/**"
      - "test/unit/meff-export.test.mjs"
      - "lib/export/Meff.js"
      - "lib/import/MeffModel.js"
      - "lib/import/MeffView.js"
      - "docs/standards/meff-schema-validation.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-meff-fixtures:
    name: Validate synthetic MEFF Model and Diagram fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch official MEFF 3.1 schemas into runner temp
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="${RUNNER_TEMP}/meff-xsd-3.1"
          mkdir -p "$schema_dir"
          base_url="https://www.opengroup.org/xsd/archimate/3.1"
          for schema in archimate3_Model.xsd archimate3_View.xsd archimate3_Diagram.xsd; do
            curl --fail --location --silent --show-error \
              --retry 2 --connect-timeout 20 --max-time 120 \
              "${base_url}/${schema}" --output "${schema_dir}/${schema}"
            test -s "${schema_dir}/${schema}"
          done
          cat > "${RUNNER_TEMP}/meff-xsd-sha256.txt" <<EOF
          6419080f4c4bc43b4a7b8acf870146a7bae6c3487a3ce08d3c521c028ea6056e  ${schema_dir}/archimate3_Diagram.xsd
          dd451abe3e3193f91dd9544b279af9bbbf17e75ff1ef86f65ad52b3f8cd29794  ${schema_dir}/archimate3_Model.xsd
          d708ce176403034b1229b892712cfd69660aefe17da4cc54acea1ac35e4a9854  ${schema_dir}/archimate3_View.xsd
          EOF
          sha256sum --check "${RUNNER_TEMP}/meff-xsd-sha256.txt"
          {
            echo "### Transient MEFF schema fetch"
            echo
            echo "Checksums match the pinned official schema digests. Schema files stayed in RUNNER_TEMP and were not uploaded or committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install XML Schema validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils

      - name: Validate positive and negative synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          model_schema="${RUNNER_TEMP}/meff-xsd-3.1/archimate3_Model.xsd"
          diagram_schema="${RUNNER_TEMP}/meff-xsd-3.1/archimate3_Diagram.xsd"
          xmllint --noout --schema "$model_schema" test/fixtures/meff-schema/valid-model.xml
          xmllint --noout --schema "$model_schema" test/fixtures/meff-schema/valid-model-records.xml
          xmllint --noout --schema "$diagram_schema" test/fixtures/meff-schema/valid-view-diagram.xml
          xmllint --noout --schema "$diagram_schema" test/fixtures/meff-schema/valid-view-annotations.xml
          xmllint --noout --schema "$diagram_schema" test/fixtures/meff-schema/valid-view-presentation.xml
          xmllint --noout --schema "$diagram_schema" test/fixtures/meff-schema/valid-view-viewpoint.xml
          invalid_log="${RUNNER_TEMP}/meff-invalid-fixture.log"
          if xmllint --noout --schema "$model_schema" test/fixtures/meff-schema/invalid-missing-model-identifier.xml >"$invalid_log" 2>&1; then
            echo "Expected the missing-model-identifier fixture to fail XSD validation."
            exit 1
          fi
          cat "$invalid_log"
          if ! grep -Eiq "identifier" "$invalid_log"; then
            echo "Negative fixture failed for an unexpected reason; expected the missing identifier."
            exit 1
          fi
          echo "Positive Model and View/Diagram fixtures are schema-valid; negative Model fixture failed for missing identifier."

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Generate transient round-trip exports
        env:
          MEFF_XSD_OUTPUT_DIR: ${{ runner.temp }}/meff-exports
        run: |
          npm ci --ignore-scripts
          npx vitest run test/unit/meff-export.test.mjs

      - name: Validate generated exports against pinned schemas
        shell: bash
        run: |
          set -euo pipefail
          xmllint --noout --schema "${RUNNER_TEMP}/meff-xsd-3.1/archimate3_Model.xsd" "${RUNNER_TEMP}/meff-exports/exported-model.xml"
          xmllint --noout --schema "${RUNNER_TEMP}/meff-xsd-3.1/archimate3_Diagram.xsd" "${RUNNER_TEMP}/meff-exports/exported-view-diagram.xml"
          xmllint --noout --schema "${RUNNER_TEMP}/meff-xsd-3.1/archimate3_Diagram.xsd" "${RUNNER_TEMP}/meff-exports/exported-edited-diagram.xml"
